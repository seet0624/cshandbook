<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;grid-template-columns:minmax(240px,300px) 1fr;gap:0">
  <div style="padding:22px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px">
    <div>
      <div style="font-family:var(--serif);font-weight:700;font-size:13px;color:var(--gold-deep);letter-spacing:.08em;margin-bottom:9px">1 · 操作范围</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button onClick="{{ setNew }}" style="{{ bNew }}">改去新团队（改团队申请）</button>
        <button onClick="{{ setIn }}" style="{{ bIn }}">团队内部调整</button>
        <button onClick="{{ setAcct }}" style="{{ bAcct }}">自己户口 1 ↔ 户口 2</button>
      </div>
    </div>
    <div>
      <div style="font-family:var(--serif);font-weight:700;font-size:13px;color:var(--gold-deep);letter-spacing:.08em;margin-bottom:9px">2 · 改什么</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button onClick="{{ setInv }}" style="{{ bInv }}">仅改邀约人</button>
        <button onClick="{{ setBoth }}" style="{{ bBoth }}">邀约人 ＋ 安置人</button>
        <button onClick="{{ setPlace }}" style="{{ bPlace }}">只改安置人</button>
        <button onClick="{{ setRet }}" style="{{ bRet }}">归还原邀约人</button>
      </div>
      <p style="margin:8px 0 0;font-size:11.5px;line-height:1.6;color:var(--ink-faint)">{{ naNote }}</p>
    </div>
    <div>
      <div style="font-family:var(--serif);font-weight:700;font-size:13px;color:var(--gold-deep);letter-spacing:.08em;margin-bottom:9px">3 · 归还多久（仅归还原邀约人）</div>
      <div style="display:flex;gap:6px">
        <button onClick="{{ setRetL }}" style="{{ bRetL }}">未满半年</button>
        <button onClick="{{ setRetG }}" style="{{ bRetG }}">超过半年</button>
      </div>
    </div>
    <div>
      <div style="font-family:var(--serif);font-weight:700;font-size:13px;color:var(--gold-deep);letter-spacing:.08em;margin-bottom:9px">4 · 满申请期限了吗（改邀约人）</div>
      <div style="display:flex;gap:6px">
        <button onClick="{{ setDueOk }}" style="{{ bDueOk }}">已满</button>
        <button onClick="{{ setDueEarly }}" style="{{ bDueEarly }}">未满</button>
      </div>
      <p style="margin:8px 0 0;font-size:11.5px;line-height:1.6;color:var(--ink-faint)">只有上课记录：最近一次上课满 6 个月；有工具购买：最近一次上课或工具记录满 1 年。
      </div>
    </div>
  </div>

  <div style="padding:24px;background:linear-gradient(160deg,var(--card-2),var(--card))">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px solid var(--gold)">
      <h4 style="margin:0;font-family:var(--serif);font-weight:900;font-size:21px;color:var(--ink);line-height:1.3">{{ vTitle }}</h4>
      <span style="font-family:var(--latin);font-weight:700;font-size:13px;color:#fff;background:var(--gold-deep);padding:3px 10px;white-space:nowrap">情形 {{ vCase }}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:18px 0">
      <div style="background:var(--card);border-radius:10px;border:1px solid var(--line);padding:14px 16px">
        <div style="font-family:var(--serif);font-size:12px;color:var(--gold-deep);letter-spacing:.08em;margin-bottom:5px">业绩清零</div>
        <div style="font-family:var(--serif);font-weight:700;font-size:20px;color:var(--ink)">{{ vReset }}</div>
      </div>
      <div style="background:var(--card);border-radius:10px;border:1px solid var(--line);padding:14px 16px">
        <div style="font-family:var(--serif);font-size:12px;color:var(--gold-deep);letter-spacing:.08em;margin-bottom:5px">费用</div>
        <div style="font-family:var(--serif);font-weight:700;font-size:20px;color:var(--ink)">{{ vQuote }}</div>
      </div>
      <div style="background:var(--card);border-radius:10px;border:1px solid var(--line);padding:14px 16px">
        <div style="font-family:var(--serif);font-size:12px;color:var(--gold-deep);letter-spacing:.08em;margin-bottom:5px">资格要求</div>
        <div style="font-size:13px;line-height:1.6;color:var(--ink)">{{ vQual }}</div>
      </div>
    </div>
    <div style="background:var(--card);border-radius:10px;border:1px solid var(--line);border-left:3px solid var(--gold);padding:14px 18px;margin-bottom:14px">
      <div style="font-family:var(--serif);font-size:12px;color:var(--gold-deep);letter-spacing:.08em;margin-bottom:5px">需谁同意</div>
      <div style="font-size:14px;line-height:1.75;color:var(--ink);white-space:pre-line">{{ vAgree }}</div>
    </div>
    <div style="background:var(--ink);border-radius:var(--r,14px);color:#fff;padding:16px 18px">
      <div style="font-family:var(--serif);font-size:12px;color:var(--gold-lt);letter-spacing:.08em;margin-bottom:7px">必须附上</div>
      <div style="font-size:14px;line-height:1.85;white-space:pre-line">{{ vExtra }}</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:560}}">
class Component extends DCLogic {
  state = { scope: 'in', change: 'inv', ret: 'lt6', due: 'ok' };
  set(k, v) { return () => this.setState({ [k]: v }); }

  effChange() {
    const s = this.state;
    if (s.scope === 'new' && (s.change === 'place' || s.change === 'ret')) return 'inv';
    if (s.scope === 'acct' && s.change === 'ret') return 'inv';
    return s.change;
  }

  btn(on, dis) {
    const base = 'text-align:left;padding:10px 13px;font-size:13.5px;font-family:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);line-height:1.4;transition:background .15s,border-color .15s;';
    if (dis) return base + 'background:var(--card);color:var(--ink-faint);opacity:.45;pointer-events:none;';
    if (on) return base + 'background:var(--ink);border-color:var(--ink);color:#fff;';
    return base + 'background:var(--card);color:var(--ink);';
  }

  // 改邀约人（含改团队）一律按 6.1 流程：学员本人填表、RM600、业绩及级别清零；改安置人一律报价
  movesInv() { return this.state.scope !== 'acct' && this.effChange() !== 'place'; }
  // 例外：归还原邀约人未满半年 —— 免费、不清零、无需同意
  freeReturn() { return this.state.scope === 'in' && this.effChange() === 'ret' && this.state.ret === 'lt6'; }

  decide() {
    const s = this.state;
    const change = this.effChange();
    let r = { kase: '', title: '', qual: '无资格要求', agree: '无需同意，直接申请', reset: '清零', quote: '需报价', extra: ['写明申请理由'] };

    if (this.freeReturn()) {
      r.kase = '2.1b'; r.title = '团队内部 · 归还原邀约人（未满半年）';
      r.reset = '不清零'; r.quote = '免费'; r.qual = '无资格要求（归还未满半年）'; r.agree = '无需原邀约人同意';
      r.extra = ['学员本人填写申请表，用登记邮箱提交（后台已不能申请）', '写明申请理由', '致电学员确认介绍人（话术见 6.3）'];
    } else if (this.movesInv()) {
      const early = s.due === 'early';
      if (s.scope === 'new') { r.kase = change === 'both' ? '1.2' : '1.1'; r.title = change === 'both' ? '改团队申请 · 邀约人＋安置人' : '改团队申请 · 仅改邀约人'; }
      else if (change === 'inv') { r.kase = '2.1a'; r.title = '团队内部 · 仅改邀约人'; }
      else if (change === 'both') { r.kase = '2.2'; r.title = '团队内部 · 改邀约人＋安置人'; }
      else { r.kase = '2.1b'; r.title = '团队内部 · 归还原邀约人（超过半年）'; }
      r.reset = '清零（业绩及级别）';
      r.quote = 'RM600 手续费';
      r.qual = early ? '未满申请期限' : '已满申请期限';
      r.agree = early ? '学员本人申请\n＋ 原邀约人同意，并在申请表签名' : '学员本人申请即可';
      r.extra = ['学员本人填写《更换邀约人业务申请表》并签名', '用学员登记邮箱发送到 csshuyi5796@gmail.com'];
      if (early) r.extra.push('原邀约人在申请表签名');
      r.extra.push('写明申请理由', '新邀约人须已完款工具', '致电学员确认介绍人（话术见 6.3）', '公司审核获批后，学员本人缴付 RM600');
    } else if (s.scope === 'in') {
      r.kase = '2.3'; r.title = '团队内部 · 只改安置人';
    } else if (change === 'place') {
      r.kase = '3.2'; r.title = '自户口 · 安置人 户口1 → 户口2'; r.quote = '需报价';
    } else {
      r.kase = '3.1'; r.title = '自户口 · 推荐人 户口1 → 户口2'; r.reset = '不清零'; r.quote = '免费';
    }
    r.extra = r.extra.map((x, i) => (i + 1) + '. ' + x).join('\n');
    return r;
  }

  renderVals() {
    const s = this.state, r = this.decide();
    const eq = this.effChange();
    const disPlace = s.scope === 'new', disRet = s.scope !== 'in';
    const inv = this.movesInv(), disRetTime = this.effChange() !== 'ret' || s.scope !== 'in', disDue = !inv || this.freeReturn();
    const half = 'flex:1;';
    return {
      bNew: this.btn(s.scope === 'new'), bIn: this.btn(s.scope === 'in'), bAcct: this.btn(s.scope === 'acct'),
      setNew: this.set('scope', 'new'), setIn: this.set('scope', 'in'), setAcct: this.set('scope', 'acct'),
      bInv: this.btn(s.change === 'inv'), bBoth: this.btn(s.change === 'both'),
      bPlace: this.btn(s.change === 'place', disPlace), bRet: this.btn(s.change === 'ret', disRet),
      setInv: this.set('change', 'inv'), setBoth: this.set('change', 'both'), setPlace: this.set('change', 'place'), setRet: this.set('change', 'ret'),
      bRetL: this.btn(s.ret === 'lt6', disRetTime) + half, bRetG: this.btn(s.ret === 'gt6', disRetTime) + half,
      setRetL: this.set('ret', 'lt6'), setRetG: this.set('ret', 'gt6'),
      bDueOk: this.btn(s.due === 'ok', disDue) + half, bDueEarly: this.btn(s.due === 'early', disDue) + half,
      setDueOk: this.set('due', 'ok'), setDueEarly: this.set('due', 'early'),
      naNote: s.scope === 'new' ? '改团队申请只涉及邀约人（可带安置人），其余两项不适用。'
        : (s.scope === 'acct' ? '自户口调整只分推荐人与安置人，不涉及归还。' : '归还＝把邀约人改回原本那一位：未满半年免费、不清零；超过半年按正常流程。'),
      vTitle: r.title, vCase: r.kase, vQual: r.qual, vAgree: r.agree, vReset: r.reset, vQuote: r.quote, vExtra: r.extra
    };
  }
}
</script>
</body>
</html>
